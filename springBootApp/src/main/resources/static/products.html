<!DOCTYPE html>
<html>
<head>
    <title>Product Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Product Management</h1>

    <form id="productForm">
        <div>
            <input type="number" id="prodId" placeholder="Product ID" required>
            <input type="text" id="prodName" placeholder="Product Name" required>
            <input type="number" id="price" placeholder="Quantity" required>
        </div>
        <div class="form_buttons">
            <button type="submit">Save</button>
            <button type="reset" >Clear</button>
        </div>

    </form>

    <table>
        <thead>
        <tr>
            <th>ID</th><th>Name</th><th>Quantity</th><th>Actions</th>
        </tr>
        </thead>
        <tbody id="productTable"></tbody>
    </table>
</div>

<script src="script.js"></script>
</body>
</html>
